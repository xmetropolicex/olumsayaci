<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OBS Ölüm Sayacı - Canlı Yayın Overlay</title>
  <link rel="stylesheet" href="css/overlay.css">
  <!-- MQTT CDN -->
  <script src="https://unpkg.com/mqtt@4.3.7/dist/mqtt.min.js"></script>
</head>
<body class="overlay-mode">
  <!-- Kırmızı Ekran Parıltısı -->
  <div id="flashOverlay" class="death-flash-overlay"></div>

  <!-- Ana Kart Kapsayıcısı -->
  <div id="cardWrapper" class="death-card-wrapper theme-souls layout-horizontal">
    <div id="deathCard" class="death-card">
      
      <!-- Avatar / Oyun Posteri Bölümü -->
      <div class="avatar-container">
        <img id="avatarImg" class="avatar-img" src="assets/presets/elden_ring.svg" alt="Oyun Posteri" />
        <span class="avatar-badge">LIVE</span>
      </div>

      <!-- Oyun ve Karakter Bilgisi -->
      <div class="info-section">
        <div id="gameTitle" class="game-title">ELDEN RING</div>
        <div id="charName" class="char-name">TARNISHED</div>
        <div class="label-pill">
          <span id="counterLabel">ÖLÜM SAYISI</span>
        </div>
      </div>

      <!-- Ölüm Sayacı -->
      <div id="counterSection" class="counter-section">
        <svg class="skull-icon" viewBox="0 0 24 24">
          <path d="M12 2C6.48 2 2 6.48 2 12C2 15.5 3.79 18.57 6.5 20.35V22H17.5V20.35C20.21 18.57 22 15.5 22 12C22 6.48 17.52 2 12 2ZM9 11C8.17 11 7.5 10.33 7.5 9.5C7.5 8.67 8.17 8 9 8C9.83 8 10.5 8.67 10.5 9.5C10.5 10.33 9.83 11 9 11ZM15 11C14.17 11 13.5 10.33 13.5 9.5C13.5 8.67 14.17 8 15 8C15.83 8 16.5 8.67 16.5 9.5C16.5 10.33 15.83 11 15 11ZM9.5 18H8V15.5H9.5V18ZM12.75 18H11.25V15.5H12.75V18ZM16 18H14.5V15.5H16V18Z"/>
        </svg>
        <div id="counterValue" class="counter-value">0</div>
      </div>

    </div>
  </div>

  <!-- Scriptler -->
  <script src="js/audio.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/overlay.js"></script>
</body>
</html>
